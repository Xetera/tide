name: Generate Schemas

on:
  push:
    branches: [main]
    paths:
      - 'src/sites/**'
      - 'src/site-spec/**'
      - 'src/scripts/print-schema.ts'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Generate schemas
        run: pnpm schema

      - name: Commit schemas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schemas/
          git diff --cached --quiet || git commit -m "chore: regenerate schemas"
          git push
